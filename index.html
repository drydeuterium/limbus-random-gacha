<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151614">
  <meta name="description" content="Limbus Companyの人格を等確率で抽出。単発と囚人ごとのパーティ抽出に対応。">
  <title>人格抽出 — Limbus Company</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data/personas.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LCB</span>
        <div><p class="brand-caption">LIMBUS COMPANY</p><h1>人格抽出</h1></div>
      </div>
      <nav class="header-actions" aria-label="関連リンクと表示">
        <a href="https://wikiwiki.jp/lcbwiki/%E4%BA%BA%E6%A0%BC" target="_blank" rel="noreferrer">wiki一覧 <span aria-hidden="true">↗</span></a>
        <button id="themeToggle" class="quiet-button" type="button" aria-pressed="false">ダーク</button>
      </nav>
    </header>

    <main class="workspace">
      <details id="filterPanel" class="filter-panel" open>
        <summary><span>抽出条件</span><span id="filterSummary" class="filter-summary">すべて</span></summary>
        <form id="filterForm">
          <div class="field">
            <label for="searchInput">人格名・囚人</label>
            <input id="searchInput" type="search" placeholder="名前で絞る" autocomplete="off">
          </div>
          <div class="field-pair">
            <div class="field">
              <label for="raritySelect">レア度</label>
              <select id="raritySelect"><option value="all">すべて</option><option value="3">星3</option><option value="2">星2</option><option value="1">星1</option></select>
            </div>
            <div class="field">
              <label for="seasonSelect">シーズン</label>
              <select id="seasonSelect"><option value="all">すべて</option></select>
            </div>
          </div>
          <fieldset>
            <legend>囚人 <span id="sinnerSummary">全員</span></legend>
            <div id="sinnerFilters" class="sinner-grid"></div>
            <button id="clearSinnersButton" class="text-button" type="button">全員に戻す</button>
          </fieldset>
          <div class="exclusion-control">
            <label class="checkbox-label" for="excludeDrawn">
              <input id="excludeDrawn" type="checkbox">
              <span>引いた人格を除外</span>
            </label>
            <button id="clearHistoryButton" class="text-button" type="button">除外を解除</button>
          </div>
          <button id="resetFiltersButton" class="quiet-button reset-filters" type="button">条件をリセット</button>
        </form>
      </details>

      <section class="draw-panel" aria-label="人格の抽出">
        <div class="draw-toolbar">
          <div class="mode-switch" role="group" aria-label="抽出モード">
            <button id="singleModeButton" class="mode-button" type="button" aria-pressed="true">単発</button>
            <button id="partyModeButton" class="mode-button" type="button" aria-pressed="false">パーティ</button>
          </div>
          <button id="drawButton" class="draw-button" type="button" aria-describedby="poolWarning">
            <span id="drawButtonLabel">抽出する</span><span aria-hidden="true">↗</span>
          </button>
        </div>
        <div class="pool-readout"><span>抽出対象 <strong id="poolCount">—</strong> 人格</span><span id="modeNote">等確率 · 1人格</span></div>
        <p id="poolWarning" class="notice" role="status" hidden></p>

        <div class="result-heading">
          <h2>抽出結果</h2>
          <div class="result-actions">
            <button id="copyButton" class="text-button" type="button" disabled>コピー</button>
            <button id="resetButton" class="text-button" type="button" disabled>クリア</button>
          </div>
        </div>
        <div id="resultStage" class="result-stage" aria-live="polite" aria-atomic="true"></div>
        <p id="actionNotice" class="notice" role="status" hidden></p>
        <p id="drawMessage" class="sr-only" role="status"></p>
      </section>
    </main>
    <footer class="app-footer"><span>攻略用ランダム選択 · ゲーム内排出率とは異なる</span><span id="dataDate"></span></footer>
    <noscript>抽出にはJavaScriptを有効にする必要がある。</noscript>
  </div>
</body>
</html>
