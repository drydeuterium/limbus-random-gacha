<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#191a18">
    <meta
      name="description"
      content="Limbus Companyの人格一覧から、ソロ攻略用の人格を一回だけ抽選するツール"
    >
    <title>人格単発ガチャ — Limbus Company</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <a class="brand" href="./" aria-label="人格単発ガチャのトップへ">
          <span class="brand-mark" aria-hidden="true">LCB</span>
          <span class="brand-copy">
            <span class="brand-eyebrow">SOLO RUN / SINGLE DRAW</span>
            <span class="brand-title">人格単発ガチャ</span>
          </span>
        </a>
        <div class="header-actions">
          <a
            class="header-source"
            href="https://wikiwiki.jp/lcbwiki/%E4%BA%BA%E6%A0%BC"
            target="_blank"
            rel="noreferrer"
          >wiki一覧</a>
          <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">
            ダーク
          </button>
        </div>
      </header>

      <main>
        <div class="workbench">
          <section class="draw-panel" aria-labelledby="draw-heading">
            <div class="section-bar">
              <h2 id="draw-heading">抽選結果</h2>
              <span class="section-index" aria-hidden="true">RESULT</span>
            </div>

            <div id="resultStage" class="result-stage is-empty" aria-live="polite">
              <div class="result-empty">
                <span class="result-status">WAITING</span>
                <p class="result-placeholder">未抽選</p>
              </div>
            </div>

            <div class="draw-controls">
              <button id="drawButton" class="draw-button" type="button">
                <span>人格を引く</span>
                <span class="draw-button-code">DRAW 01</span>
              </button>
              <div class="draw-secondary">
                <button id="copyButton" class="text-button" type="button" hidden>結果をコピー</button>
                <button id="resetButton" class="text-button" type="button">結果をリセット</button>
              </div>
            </div>
            <p id="drawMessage" class="draw-message" role="status"></p>

            <details id="historySection" class="history-section">
              <summary class="history-summary">
                <span>
                  <span class="history-summary-label">履歴</span>
                  <span id="historySummaryCount" class="history-summary-count">0件</span>
                </span>
                <span class="history-summary-arrow" aria-hidden="true">＋</span>
              </summary>
              <div class="history-content">
                <div class="history-actions">
                  <span id="history-heading" class="sr-only">抽選履歴</span>
                  <button id="clearHistoryButton" class="text-button" type="button">履歴を消去</button>
                </div>
                <div id="historyList" class="history-list" aria-live="polite"></div>
              </div>
            </details>
          </section>

          <details id="filterPanel" class="filter-panel" open>
            <summary class="section-bar">
              <h2 id="filter-heading">抽選条件</h2>
              <span class="section-index" aria-hidden="true">FILTER</span>
            </summary>

            <form id="filterForm">
              <div class="field">
                <label for="searchInput">人格名・囚人</label>
                <input
                  id="searchInput"
                  type="search"
                  autocomplete="off"
                  placeholder="例：ホンル / 黒雲会"
                >
              </div>

              <div class="field-row">
                <div class="field">
                  <label for="raritySelect">星</label>
                  <select id="raritySelect">
                    <option value="all">すべて</option>
                    <option value="3">星3</option>
                    <option value="2">星2</option>
                    <option value="1">星1</option>
                  </select>
                </div>
                <div class="field">
                  <label for="seasonSelect">シーズン</label>
                  <select id="seasonSelect">
                    <option value="all">すべて</option>
                    <option value="0">恒常</option>
                    <option value="1">Season 1</option>
                    <option value="2">Season 2</option>
                    <option value="3">Season 3</option>
                    <option value="4">Season 4</option>
                    <option value="5">Season 5</option>
                    <option value="6">Season 6</option>
                    <option value="7">Season 7</option>
                    <option value="W">ヴァルプルギスの夜</option>
                  </select>
                </div>
              </div>

              <details class="advanced-filters">
                <summary>
                  <span>囚人を指定</span>
                  <span id="sinnerSummary" class="advanced-summary-value">全員</span>
                </summary>
                <div class="advanced-filters-content">
                  <div id="sinnerFilters" class="sinner-grid"></div>
                  <button id="clearSinnersButton" class="small-button" type="button">全員</button>
                </div>
              </details>

              <div class="toggle-list">
                <label class="toggle-row" for="excludeDrawn">
                  <input id="excludeDrawn" type="checkbox">
                  <span class="fake-toggle" aria-hidden="true"></span>
                  <strong>引いた人格を除外</strong>
                </label>
              </div>
            </form>

            <div class="pool-readout" aria-live="polite">
              <div class="pool-readout-main">
                <span>抽選対象</span>
                <strong id="poolCount">185</strong>
                <span>人格</span>
              </div>
              <dl>
                <div>
                  <dt>1人格あたり</dt>
                  <dd id="poolOdds">0.54%</dd>
                </div>
                <div>
                  <dt>抽選履歴</dt>
                  <dd id="historyCount">0</dd>
                </div>
              </dl>
            </div>
            <p id="poolWarning" class="pool-warning" role="alert" hidden></p>
          </details>
        </div>
      </main>
    </div>

    <script src="data/personas.js"></script>
    <script src="app.js"></script>
  </body>
</html>
