name: Update persona data

'on':
  schedule:
    # 毎週金曜 00:00 JST（木曜15:00 UTC）
    - cron: "0 15 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-persona-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update persona data
        run: python scripts/update-data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/personas.js
          if git diff --cached --quiet; then
            echo "人格データに変更なし"
          else
            git commit -m "Update persona data"
            git push
          fi
